services:
  rolecraft-codex:
    build: .
    image: rolecraft-codex:latest
    container_name: rolecraft-codex
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    env_file:
      - /root/.rolecraft/env
    volumes:
      # Codex needs to write log/, memories/, tmp/ alongside auth.json — must be :rw.
      # auth.json is not at risk: container runs only our code which never touches it.
      - /root/.codex:/root/.codex:rw
      - /root/.rolecraft/secret:/root/.rolecraft/secret:ro
      - /var/rolecraft/jobs:/var/rolecraft/jobs:rw
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8443/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
